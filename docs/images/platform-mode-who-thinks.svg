<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img">
<title>uApply platform mode: who thinks and who works</title>
<desc>Four swimlanes: the RCIC creates the case and uploads in the dashboard; the backend stores files and starts processing at once, splitting PDFs into pages; uApply's Gemini and OpenAI models do OCR, classification, section extraction, analysis and value reformatting; the backend saves values and the RCIC reviews and fixes them in the dashboard.</desc>
<style>.th{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.t{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.ts{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style>
<rect x="0" y="0" width="680" height="700" fill="#FFFFFF"/>
<rect x="30" y="30" width="140" height="610" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/><text x="100" y="52" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">RCIC</text><text x="100" y="70" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">decides</text>
<rect x="180" y="30" width="140" height="610" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/><text x="250" y="52" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">Dashboard</text><text x="250" y="70" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">uapply-business</text>
<rect x="330" y="30" width="160" height="610" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/><text x="410" y="52" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">uApply backend</text><text x="410" y="70" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">Django, Celery</text>
<rect x="500" y="30" width="150" height="610" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/><text x="575" y="52" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">Gemini, OpenAI</text><text x="575" y="70" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">uApply's API keys</text>
<rect x="40" y="90" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="100" y="109" text-anchor="middle" dominant-baseline="central" class="th" fill="#085041">Creates case</text><text x="100" y="127" text-anchor="middle" dominant-baseline="central" class="ts" fill="#0F6E56">picks the type</text>
<rect x="190" y="90" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/><text x="250" y="109" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">Case page</text><text x="250" y="127" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">document folders</text>
<rect x="40" y="170" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="100" y="189" text-anchor="middle" dominant-baseline="central" class="th" fill="#085041">Uploads files</text><text x="100" y="207" text-anchor="middle" dominant-baseline="central" class="ts" fill="#0F6E56">into folders</text>
<rect x="190" y="170" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/><text x="250" y="189" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">Upload</text><text x="250" y="207" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">bulk_upload</text>
<rect x="340" y="170" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/><text x="410" y="189" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">Stores files</text><text x="410" y="207" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">starts processing</text>
<rect x="340" y="250" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/><text x="410" y="269" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">Splits pages</text><text x="410" y="287" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">task per page</text>
<rect x="510" y="250" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="575" y="269" text-anchor="middle" dominant-baseline="central" class="th" fill="#712B13">OCR, classify</text><text x="575" y="287" text-anchor="middle" dominant-baseline="central" class="ts" fill="#993C1D">each page</text>
<rect x="510" y="330" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="575" y="349" text-anchor="middle" dominant-baseline="central" class="th" fill="#712B13">Sections</text><text x="575" y="367" text-anchor="middle" dominant-baseline="central" class="ts" fill="#993C1D">call per section</text>
<rect x="340" y="330" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/><text x="410" y="349" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">Saves memos</text><text x="410" y="367" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">per document</text>
<rect x="340" y="410" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/><text x="410" y="429" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">Starts analysis</text><text x="410" y="447" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">automatically</text>
<rect x="510" y="410" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="575" y="429" text-anchor="middle" dominant-baseline="central" class="th" fill="#712B13">Analysis</text><text x="575" y="447" text-anchor="middle" dominant-baseline="central" class="ts" fill="#993C1D">conflicts, doubts</text>
<rect x="510" y="490" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="575" y="509" text-anchor="middle" dominant-baseline="central" class="th" fill="#712B13">Reformats</text><text x="575" y="527" text-anchor="middle" dominant-baseline="central" class="ts" fill="#993C1D">into form values</text>
<rect x="340" y="490" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/><text x="410" y="509" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">Saves values</text><text x="410" y="527" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">confirmed, doubtful</text>
<rect x="190" y="570" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/><text x="250" y="589" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">Review page</text><text x="250" y="607" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">conflicts, doubts</text>
<rect x="40" y="570" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="100" y="589" text-anchor="middle" dominant-baseline="central" class="th" fill="#085041">Reviews, fixes</text><text x="100" y="607" text-anchor="middle" dominant-baseline="central" class="ts" fill="#0F6E56">then auto-fill</text>
